<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Girasoles para Brenda</title>
  <meta name="description" content="Un pequeño detalle con girasoles para Brenda">
  <meta name="theme-color" content="#130820">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20fill%3D%22%23f7c62f%22%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2210%22%20rx%3D%227%22%20ry%3D%2214%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2254%22%20rx%3D%227%22%20ry%3D%2214%22%2F%3E%3Cellipse%20cx%3D%2210%22%20cy%3D%2232%22%20rx%3D%2214%22%20ry%3D%227%22%2F%3E%3Cellipse%20cx%3D%2254%22%20cy%3D%2232%22%20rx%3D%2214%22%20ry%3D%227%22%2F%3E%3Cellipse%20cx%3D%2216.5%22%20cy%3D%2216.5%22%20rx%3D%227%22%20ry%3D%2214%22%20transform%3D%22rotate%28-45%2016.5%2016.5%29%22%2F%3E%3Cellipse%20cx%3D%2247.5%22%20cy%3D%2247.5%22%20rx%3D%227%22%20ry%3D%2214%22%20transform%3D%22rotate%28-45%2047.5%2047.5%29%22%2F%3E%3Cellipse%20cx%3D%2247.5%22%20cy%3D%2216.5%22%20rx%3D%227%22%20ry%3D%2214%22%20transform%3D%22rotate%2845%2047.5%2016.5%29%22%2F%3E%3Cellipse%20cx%3D%2216.5%22%20cy%3D%2247.5%22%20rx%3D%227%22%20ry%3D%2214%22%20transform%3D%22rotate%2845%2016.5%2047.5%29%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2213%22%20fill%3D%22%234a2508%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%229%22%20fill%3D%22%232d1605%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #221233;
      --bg-mid: #160d24;
      --bg-bottom: #0b0611;
      --gold: #f7cd58;
      --gold-soft: #fff1c4;
      --glass: rgba(27, 16, 41, 0.28);
      --glass-border: rgba(255,255,255,0.10);
      --paper-dark: #181416;
      --paper-brown: #4a332a;
      --paper-gold: #d8ad55;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 210, 65, 0.08) 0%, transparent 18%),
        radial-gradient(circle at 12% 24%, rgba(180, 92, 255, 0.08) 0%, transparent 24%),
        radial-gradient(circle at 88% 30%, rgba(255, 149, 45, 0.06) 0%, transparent 22%),
        linear-gradient(180deg, #25103d 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: absolute;
      inset: -24%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 28% 30%, rgba(255, 205, 70, 0.09) 0%, transparent 20%),
        radial-gradient(circle at 72% 35%, rgba(165, 87, 255, 0.08) 0%, transparent 23%),
        radial-gradient(circle at 50% 68%, rgba(255, 134, 35, 0.06) 0%, transparent 22%);
      filter: blur(18px);
      animation: auroraDrift 16s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(115deg, transparent 18%, rgba(255,255,255,0.010) 42%, transparent 62%),
        radial-gradient(ellipse at center, transparent 45%, rgba(5, 1, 10, 0.44) 100%);
      animation: backgroundShimmer 12s ease-in-out infinite alternate;
    }


    body.theme-day {
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 224, 141, 0.28) 0%, transparent 18%),
        radial-gradient(circle at 15% 18%, rgba(255, 202, 110, 0.16) 0%, transparent 24%),
        radial-gradient(circle at 85% 24%, rgba(255, 186, 110, 0.12) 0%, transparent 22%),
        linear-gradient(180deg, #f7e8ff 0%, #ecd8f8 28%, #d8ecff 62%, #eef7ff 100%);
      color: #4a3551;
    }

    body.theme-day::before {
      background:
        radial-gradient(circle at 25% 26%, rgba(255, 210, 90, 0.18) 0%, transparent 22%),
        radial-gradient(circle at 75% 30%, rgba(255, 170, 90, 0.12) 0%, transparent 22%),
        radial-gradient(circle at 50% 70%, rgba(255, 255, 255, 0.14) 0%, transparent 24%);
      filter: blur(14px);
      opacity: 0.85;
    }

    body.theme-day::after {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 32%, transparent 100%),
        radial-gradient(ellipse at center, transparent 58%, rgba(140, 108, 180, 0.08) 100%);
    }

    body.theme-day .header {
      background: rgba(255,255,255,0.16);
      border-color: rgba(126, 88, 150, 0.14);
      box-shadow: 0 8px 22px rgba(120, 88, 140, 0.08);
    }

    body.theme-day .header h1 {
      color: #d3981d;
      text-shadow: 0 0 9px rgba(255, 238, 196, 0.28);
    }

    body.theme-day .header p {
      color: #6c4f3b;
      text-shadow: none;
    }

    body.theme-day .stars-container,
    body.theme-day .fireflies-layer {
      opacity: 0.18;
    }

    body.theme-day .ambient-glow .bokeh {
      opacity: 0.11;
    }

    .theme-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 60;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(39, 26, 60, 0.94) 0%, rgba(19, 12, 30, 0.92) 100%);
      color: var(--gold-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform .28s ease, background .45s ease, color .35s ease, box-shadow .45s ease, border-color .35s ease;
      overflow: hidden;
      isolation: isolate;
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 58%);
      opacity: 0.9;
      z-index: 0;
      transition: opacity .35s ease, background .45s ease;
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      z-index: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .theme-toggle:hover,
    .theme-toggle:active {
      transform: translateY(-1px) scale(1.04);
    }

    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon {
      position: absolute;
      inset: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      line-height: 1;
      z-index: 1;
      transition: opacity .35s ease, transform .45s cubic-bezier(0.22, 1, 0.36, 1), filter .35s ease;
      will-change: transform, opacity;
    }

    .theme-toggle .icon-sun {
      color: #ffcf43;
      text-shadow: 0 0 14px rgba(255, 210, 89, 0.48);
      opacity: 0;
      transform: scale(0.58) rotate(-90deg);
    }

    .theme-toggle .icon-moon {
      color: #f6db7a;
      text-shadow: 0 0 12px rgba(255, 224, 127, 0.32);
      opacity: 0;
      transform: scale(0.58) rotate(90deg);
    }

    body.theme-day .theme-toggle {
      background: linear-gradient(180deg, rgba(255,255,255,0.90) 0%, rgba(238, 246, 255, 0.84) 100%);
      color: #9a6700;
      border-color: rgba(123, 95, 153, 0.14);
      box-shadow: 0 10px 22px rgba(105, 160, 214, 0.18), inset 0 1px 0 rgba(255,255,255,0.55);
    }

    body.theme-day .theme-toggle::before {
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.65), transparent 58%);
    }

    body.theme-night .theme-toggle .icon-sun,
    body.theme-day .theme-toggle .icon-moon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    body.theme-switching .theme-toggle {
      animation: themeTogglePulse .52s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.theme-switching.theme-day .theme-toggle .icon-moon,
    body.theme-switching.theme-night .theme-toggle .icon-sun {
      animation: themeIconReveal .52s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes themeTogglePulse {
      0% { transform: scale(1); }
      45% { transform: scale(0.90); }
      100% { transform: scale(1); }
    }

    @keyframes themeIconReveal {
      0% { opacity: 0; transform: scale(0.35) rotate(-110deg); }
      55% { opacity: 1; transform: scale(1.12) rotate(12deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    body,
    body::before,
    body::after,
    .header,
    .header h1,
    .header p,
    .stars-container,
    .ambient-glow,
    .fireflies-layer,
    .clouds-layer {
      transition: background .55s ease, background-image .55s ease, color .35s ease, border-color .35s ease, box-shadow .45s ease, opacity .45s ease, filter .45s ease;
    }

    .clouds-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity .55s ease;
      overflow: hidden;
    }

    body.theme-day .clouds-layer {
      opacity: 0.75;
    }

    body.theme-night .clouds-layer {
      opacity: 0;
    }

    .cloud {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.86);
      filter: blur(0.5px);
      box-shadow: 0 10px 22px rgba(196, 205, 255, 0.18);
      animation: cloudDrift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before {
      width: 44%;
      height: 82%;
      left: 12%;
      bottom: 34%;
    }

    .cloud::after {
      width: 34%;
      height: 64%;
      right: 14%;
      bottom: 28%;
    }

    @keyframes cloudDrift {
      from { transform: translateX(-18vw); }
      to { transform: translateX(118vw); }
    }

    .stars-container,
    .clouds-layer,
    .ambient-glow,
    .fireflies-layer,
    .particles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .ambient-glow::before,
    .ambient-glow::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.24;
    }

    .ambient-glow::before {
      width: 48vw;
      height: 48vw;
      min-width: 240px;
      min-height: 240px;
      top: -10%;
      left: -12%;
      background: rgba(255, 196, 0, 0.10);
      animation: glowFloatLeft 10s ease-in-out infinite alternate;
    }

    .ambient-glow::after {
      width: 42vw;
      height: 42vw;
      min-width: 210px;
      min-height: 210px;
      right: -10%;
      bottom: -12%;
      background: rgba(183, 89, 255, 0.08);
      animation: glowFloatRight 12s ease-in-out infinite alternate;
    }

    .stars-container { z-index: 1; }
    .clouds-layer { z-index: 1; }
    .ambient-glow { z-index: 2; }
    .fireflies-layer { z-index: 3; overflow: hidden; }
    .particles-layer { z-index: 40; }

    .star {
      position: absolute;
      will-change: transform, opacity;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.38);
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.16; transform: scale(0.84); }
      50% { opacity: 1; transform: scale(1.24); }
    }

    .scene {
      position: relative;
      z-index: 10;
      width: min(100vw, 1120px);
      max-width: 100vw;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .header {
      width: min(96vw, 820px);
      text-align: center;
      padding: clamp(1rem, 2.6vh, 1.6rem) clamp(1rem, 4vw, 2rem);
      background: rgba(24, 14, 39, 0.18);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
      position: relative;
      z-index: 30;
      opacity: 0;
      animation: messageReveal 1.15s cubic-bezier(0.16, 1, 0.3, 1) 0.10s forwards;
    }

    .header h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.5rem, 9vw, 4.6rem);
      line-height: 0.96;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(255,215,0,0.40), 0 0 28px rgba(255,180,0,0.18);
    }

    .header p {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.3rem, 4.7vw, 1.95rem);
      line-height: 1.2;
      color: var(--gold-soft);
      margin-top: 0.38rem;
      max-width: 23ch;
      margin-inline: auto;
      text-shadow: 0 0 5px rgba(255,255,255,0.10);
    }

    .bouquet-wrapper {
      position: relative;
      contain: layout paint;
      width: min(100%, 860px);
      height: clamp(560px, 76dvh, 860px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      animation: bouquetEntrance 1.45s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
      flex: 1;
      margin-top: 18px;
    }

    .bouquet-wrapper::before {
      content: "";
      position: absolute;
      width: min(82vw, 650px);
      height: min(58vw, 460px);
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 204, 63, 0.16) 0%, rgba(255, 171, 35, 0.08) 36%, transparent 72%);
      filter: blur(18px);
      pointer-events: none;
      animation: bouquetHalo 5.5s ease-in-out infinite alternate;
    }

    .bouquet-svg {
      width: 92%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,0.24));
      position: relative;
      z-index: 1;
    }

    .stem {
      stroke-dasharray: 820;
      stroke-dashoffset: 820;
      animation: growStem 1.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .leaf {
      transform-origin: center;
      transform-box: fill-box;
      opacity: 0;
      animation: leafSettle 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .paper-back path,
    .paper-wrap path,
    .paper-wrap rect {
      opacity: 0;
      vector-effect: non-scaling-stroke;
      animation: paperReveal 0.82s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
    }

    .flower-head {
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
      animation: flowerAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .flower-head .head-sway {
      transform-origin: center;
      transform-box: fill-box;
      animation: headSway 4.6s ease-in-out infinite alternate;
    }

    .bouquet-motion {
      transform-origin: 280px 720px;
      animation: bouquetSway 7.2s ease-in-out infinite alternate 3.6s;
    }

    .paper-wrap,
    .paper-back {
      transform-origin: 280px 650px;
      animation: wrapBreath 5.4s ease-in-out infinite alternate 3.4s;
    }

    .shadow-base {
      transform-origin: center;
      animation: shadowPulse 5s ease-in-out infinite alternate;
    }

    @keyframes growStem {
      0% { stroke-dashoffset: 820; opacity: 0.25; }
      18% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes leafSettle {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes paperReveal {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes flowerAppear {
      0% { opacity: 0; transform: scale(0.26) rotate(-5deg); }
      58% { opacity: 1; transform: scale(1.06) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes headSway {
      0% { transform: rotate(-1.4deg) translateY(0); }
      100% { transform: rotate(1.4deg) translateY(-2px); }
    }

    @keyframes bouquetSway {
      0% { transform: rotate(-0.7deg) translateY(0); }
      100% { transform: rotate(0.7deg) translateY(-3px); }
    }

    @keyframes wrapBreath {
      0% { transform: scale(1); }
      100% { transform: scale(1.006); }
    }

    @keyframes shadowPulse {
      0% { opacity: 0.16; transform: scaleX(0.97); }
      100% { opacity: 0.28; transform: scaleX(1.05); }
    }

    @keyframes messageReveal {
      0% { opacity: 0; transform: translateY(-10px) scale(0.98); filter: blur(8px); }
      70% { opacity: 1; transform: translateY(1px) scale(1.006); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes bouquetEntrance {
      0% { opacity: 0; transform: translateY(72px) scale(0.95); filter: blur(6px); }
      68% { opacity: 1; transform: translateY(34px) scale(1.01); filter: blur(0); }
      100% { opacity: 1; transform: translateY(18px) scale(0.97); filter: blur(0); }
    }

    @keyframes bouquetFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(5px); }
    }

    @keyframes bouquetHalo {
      0% { opacity: 0.48; transform: translate(-50%, -50%) scale(0.94); }
      100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes auroraDrift {
      0% { transform: translate3d(-2%, -1%, 0) rotate(-2deg) scale(1); }
      100% { transform: translate3d(3%, 2%, 0) rotate(3deg) scale(1.08); }
    }

    @keyframes backgroundShimmer {
      0% { opacity: 0.55; transform: translateX(-1%); }
      100% { opacity: 0.9; transform: translateX(1%); }
    }

    @keyframes glowFloatLeft {
      0% { transform: translate3d(-6px, 0, 0) scale(0.94); opacity: 0.24; }
      100% { transform: translate3d(22px, 18px, 0) scale(1.08); opacity: 0.42; }
    }

    @keyframes glowFloatRight {
      0% { transform: translate3d(8px, 10px, 0) scale(1); opacity: 0.18; }
      100% { transform: translate3d(-20px, -18px, 0) scale(1.12); opacity: 0.38; }
    }

    @keyframes bokehFloat {
      0% { transform: translate3d(0, 0, 0) scale(0.94); opacity: 0.12; }
      100% { transform: translate3d(12px, -18px, 0) scale(1.1); opacity: 0.24; }
    }

    .firefly {
      position: absolute;
      will-change: transform, opacity;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: rgba(255, 220, 118, 0.92);
      box-shadow: 0 0 8px rgba(255, 214, 87, 0.68), 0 0 18px rgba(255, 178, 45, 0.28);
      opacity: 0;
      animation: fireflyFloat var(--duration) ease-in-out var(--delay) infinite;
    }

    @keyframes fireflyFloat {
      0% { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.65); }
      16% { opacity: 0.8; }
      48% { opacity: 0.45; transform: translate3d(var(--drift), -22px, 0) scale(1); }
      72% { opacity: 0.85; }
      100% { opacity: 0; transform: translate3d(calc(var(--drift) * -0.35), -54px, 0) scale(0.72); }
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    .particle.night-particle {
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, rgba(255, 235, 165, 1) 0%, rgba(255, 200, 54, 0.9) 46%, rgba(255, 200, 54, 0) 100%);
      animation: particleRise 1.4s ease-out forwards;
    }

    .particle.day-particle {
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(255,244,194,0.92) 38%, rgba(255,231,154,0.52) 62%, rgba(255,231,154,0) 100%);
      filter: blur(0.2px);
      animation: particleDayFloat 1.55s ease-out forwards;
    }

              <path class="leaf" style="animation-delay:2.28s" d="M247,634 C233,622 210,624 217,642 C226,654 247,650 267,642 C260,639 253,636 247,634 Z" fill="url(#paperDarkGrad)" stroke="url(#paperGoldGrad)" stroke-width="2.5"/>
              <path class="leaf" style="animation-delay:2.28s" d="M313,634 C327,622 350,624 343,642 C334,654 313,650 293,642 C300,639 307,636 313,634 Z" fill="url(#paperDarkGrad)" stroke="url(#paperGoldGrad)" stroke-width="2.5"/>
              <rect class="leaf" style="animation-delay:2.34s" x="269" y="636" width="22" height="16" rx="7" fill="url(#paperDarkGrad)" stroke="url(#paperGoldGrad)" stroke-width="2"/>
              <path class="leaf" style="animation-delay:2.40s" d="M275,651 Q260,690 240,730 M285,651 Q300,690 320,730" stroke="#20181b" stroke-width="8" fill="none" stroke-linecap="round"/>
              <path class="leaf" style="animation-delay:2.40s" d="M275,651 Q260,690 240,730 M285,651 Q300,690 320,730" stroke="url(#paperGoldGrad)" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </main>

  <script>
    const starsContainer = document.getElementById('stars');
    const cloudsLayer = document.getElementById('clouds');
    const firefliesLayer = document.getElementById('fireflies');
    const particlesLayer = document.getElementById('particles');
    const themeToggle = document.getElementById('themeToggle');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const isMobile = matchMedia('(max-width: 767px)').matches;

    const setTheme = (theme, animated = false) => {
      if (animated) {
        document.body.classList.add('theme-switching');
        window.clearTimeout(window.__themeSwitchTimer);
        window.__themeSwitchTimer = window.setTimeout(() => {
          document.body.classList.remove('theme-switching');
        }, 560);
      }
      document.body.classList.remove('theme-day', 'theme-night');
      document.body.classList.add(theme === 'day' ? 'theme-day' : 'theme-night');
      if (themeMeta) themeMeta.setAttribute('content', theme === 'day' ? '#efe6fb' : '#130820');
      if (themeToggle) themeToggle.setAttribute('aria-label', theme === 'day' ? 'Cambiar a modo noche' : 'Cambiar a modo día');
      localStorage.setItem('girasolesTheme', theme);
    };

    const getAutoTheme = () => {
      const hour = new Date().getHours();
      return hour >= 7 && hour < 19 ? 'day' : 'night';
    };

    setTheme(localStorage.getItem('girasolesTheme') || getAutoTheme());

    const appendBatch = (target, count, factory) => {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < count; i++) fragment.appendChild(factory(i));
      target.appendChild(fragment);
    };

    appendBatch(starsContainer, isMobile ? 56 : 88, () => {
      const star = document.createElement('span');
      star.className = 'star';
      const size = Math.random() * 2.6 + 1;
      Object.assign(star.style, {
        width: `${size}px`,
        height: `${size}px`,
        left: `${Math.random() * 100}%`,
        top: `${Math.random() * 100}%`,
        animationDuration: `${Math.random() * 3 + 2.4}s`,
        animationDelay: `${Math.random() * 2}s`
      });
      return star;
    });

    appendBatch(cloudsLayer, isMobile ? 5 : 7, () => {
      const cloud = document.createElement('span');
      cloud.className = 'cloud';
      const width = Math.round((isMobile ? 82 : 110) + Math.random() * (isMobile ? 56 : 84));
      const height = Math.round(width * (0.34 + Math.random() * 0.08));
      Object.assign(cloud.style, {
        width: `${width}px`,
        height: `${height}px`,
        left: `${-20 - Math.random() * 25}vw`,
        top: `${6 + Math.random() * 30}%`,
        opacity: `${0.52 + Math.random() * 0.22}`,
        animationDuration: `${28 + Math.random() * 24}s`,
        animationDelay: `${-Math.random() * 18}s`
      });
      return cloud;
    });

    appendBatch(firefliesLayer, isMobile ? 8 : 12, () => {
      const firefly = document.createElement('span');
      firefly.className = 'firefly';
      const size = (Math.random() * 2.8 + 1.6).toFixed(1);
      firefly.style.cssText = `--size:${size}px;--x:${8 + Math.random() * 84}%;--y:${24 + Math.random() * 68}%;--duration:${6 + Math.random() * 6}s;--delay:${-Math.random() * 8}s;--drift:${(Math.random() - 0.5) * 70}px`;
      return firefly;
    });

    document.addEventListener('pointerdown', (event) => {
      if (!event.isPrimary) return;
      const isDayMode = document.body.classList.contains('theme-day');
      appendBatch(particlesLayer, 5, (i) => {
        const particle = document.createElement('span');
        particle.className = `particle ${isDayMode ? 'day-particle' : 'night-particle'}`;
        particle.style.left = `${event.clientX + (Math.random() - 0.5) * 28}px`;
        particle.style.top = `${event.clientY + (Math.random() - 0.5) * 18}px`;
        particle.style.setProperty('--dx', `${(Math.random() - 0.5) * (isDayMode ? 42 : 28)}px`);
        particle.style.animationDelay = `${i * 0.04}s`;
        setTimeout(() => particle.remove(), isDayMode ? 1600 : 1450);
        return particle;
      });
    }, { passive: true });

    themeToggle?.addEventListener('click', () => {
      const nextTheme = document.body.classList.contains('theme-day') ? 'night' : 'day';
      setTheme(nextTheme, true);
    });

    document.addEventListener('visibilitychange', () => {
      document.body.classList.toggle('is-paused', document.hidden);
    });
  </script>
</body>
</html>
